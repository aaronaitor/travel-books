<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上海-苏州 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=DM+Serif+Display&family=Caveat:wght@600;700&family=Ma+Shan+Zheng&display=swap">
<style>
:root{
  --desk:#D9D2C5; --desk-2:#CFC6B6;
  --cloth:#1F4F4A; --cloth-2:#173C38; --cloth-ink:#F3E9D2; --gold-1:#F2D48B; --gold-2:#B9893B;
  --paper:#FBF7EE; --paper-2:#F3EDDF; --paper-edge:#E2D8C4; --ink:#2A2521; --muted:#6F665B; --line:#E0D6C3;
  --surface:#FFFFFF; --surface-2:#F1EBDD;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#D7EDEA; --warn:#A86400; --warn-soft:#FBEBD2;
  --sign:#1F2A2E; --sign-ink:#FFFFFF; --pin:#1A2023; --pin-ink:#FFFFFF; --hi:#E4572E;
  --m0:#D93A22; --m1:#2563C9; --m2:#16895A; --m3:#D9780F; --m4:#8544C4;
  --art-sky:#D8ECF1; --art-sea:#6FB8BF; --art-sand:#EBD9B0; --art-hill:#86B38F; --art-deep:#3E6F5E; --art-ink:#243B3D; --art-line:#243B3D; --art-sun:#F3A83B; --art-warm:#D8644A; --art-paper:#FFF9EE; --art-cloud:#FFFFFF; --art-night:#1E2A44; --art-stone:#B9B4A8; --art-wall:#FFF6E6;
  --zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  --sans:"Archivo","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --serif:"DM Serif Display","Noto Serif SC",Georgia,serif;
  --hand:"Caveat","Ma Shan Zheng",cursive;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --desk:#15120F; --desk-2:#1D1915;
    --cloth:#3A2A1E; --cloth-2:#2A1E15; --cloth-ink:#F0E3C8; --gold-1:#E9C77A; --gold-2:#9C7433;
    --paper:#24211C; --paper-2:#1D1A16; --paper-edge:#3A342B; --ink:#EDE6D8; --muted:#A99F8F; --line:#3A342B;
    --surface:#2C2822; --surface-2:#332E27;
    --accent:#5CC6BA; --accent-ink:#0B1F1D; --accent-soft:#16332F; --warn:#E3A650; --warn-soft:#3A2A12;
    --sign:#EDE6D8; --sign-ink:#15120F; --pin:#EDE6D8; --pin-ink:#15120F; --hi:#FF7A52;
    --m0:#FF6E54; --m1:#74A6FF; --m2:#4FD197; --m3:#FFAE52; --m4:#BE92FF;
    --art-sky:#1B2C35; --art-sea:#2B6B70; --art-sand:#5E5238; --art-hill:#3B6A52; --art-deep:#22463B; --art-ink:#0E1719; --art-line:#C9D6D3; --art-sun:#D98E2F; --art-warm:#B4513C; --art-paper:#CFC7B6; --art-cloud:#3A4A52; --art-night:#0F1626; --art-stone:#7D786E; --art-wall:#2B2A26;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,var(--desk) 0%,var(--desk-2) 100%);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zh{font-family:var(--zh)}
[hidden]{display:none!important}

/* ---------- cover ---------- */
.cover-scene{position:fixed;inset:0;display:grid;place-items:center;perspective:1800px;padding:20px;cursor:pointer}
.cover{position:relative;width:min(86vw,420px);aspect-ratio:3/4.3;max-height:88dvh;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.05,.2,1),opacity .4s 1s}
.cover .board{position:absolute;inset:0;border-radius:6px 14px 14px 6px;overflow:hidden;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px),linear-gradient(160deg,var(--cloth) 0%,var(--cloth-2) 100%);
  box-shadow:0 30px 60px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.25),inset -6px 0 12px rgba(0,0,0,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9% 9% 8% 15%;color:var(--cloth-ink);text-align:center}
.cover .spine{position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.08) 60%,rgba(255,255,255,.08));border-right:1px solid rgba(0,0,0,.25)}
.cover .spine::before,.cover .spine::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-2),var(--gold-1),var(--gold-2));opacity:.7}
.cover .spine::before{top:10%} .cover .spine::after{bottom:10%}
.cover .invite:empty{display:none}
.cover .invite{font:700 clamp(20px,5.4vw,28px)/1.1 var(--hand);color:var(--gold-1)}
.cover h1{margin:0;font:400 clamp(32px,9.5vw,50px)/1.05 var(--serif);letter-spacing:.01em;
  background:linear-gradient(180deg,var(--gold-1) 0%,#fff2c8 45%,var(--gold-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 1px 0 rgba(0,0,0,.2);text-wrap:balance}
.cover .rule{width:40%;height:2px;margin:8px auto;background:linear-gradient(90deg,transparent,var(--gold-1),transparent)}
.cover .when{font:600 clamp(14px,3.8vw,17px) var(--sans);letter-spacing:.06em;text-transform:uppercase}
.cover .where{font:500 clamp(13px,3.6vw,16px) var(--zh);opacity:.92}
.cover .label{width:100%;background:#F6EBD2;border:2px solid var(--gold-2);border-radius:6px;padding:6px;box-shadow:inset 0 0 0 3px #F6EBD2,inset 0 0 0 4px var(--gold-2);display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:5px}
.cover .label .art{aspect-ratio:1/1.05;max-height:none;border-radius:4px}
.cover .label .art svg{height:100%;width:auto;min-width:100%;object-fit:cover}
.cover .label .art img{width:100%;height:100%;object-fit:cover;display:block}
.cover .label:has(img) .art{aspect-ratio:3/4}
.cover .cmagnet{width:62%;transform:rotate(-4deg);filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.cover .cmagnet svg{display:block;width:100%;height:auto}
.cover .cmagnet.corner{position:absolute;right:3%;bottom:2.5%;width:27%;transform:rotate(9deg);z-index:2}
.cover .cmagnet.drop{animation:magnetdrop .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes magnetdrop{from{transform:translateY(-40px) rotate(0) scale(1.18);opacity:0}}
.cover .cnote{font:600 17px/1.3 var(--hand);opacity:.9}
.cover .cnote:empty{display:none}
.cover-scene.opening .cover{transform:rotateY(-165deg);opacity:0}

/* ---------- reader: book, pages, thumb index ---------- */
.reader{position:fixed;inset:0;padding:max(10px,env(safe-area-inset-top)) 46px calc(60px + env(safe-area-inset-bottom)) 10px}
.book{position:relative;height:100%;max-width:1180px;margin:0 auto;display:flex;perspective:2200px}
.left-leaf{display:none}
.stack{position:relative;flex:1;height:100%}
.page{position:absolute;inset:0;background:
    radial-gradient(circle at 20% 10%,rgba(0,0,0,.018) 0 1px,transparent 1px) 0 0/7px 7px,
    linear-gradient(90deg,rgba(0,0,0,.10) 0,rgba(0,0,0,0) 22px),var(--paper);
  border-radius:3px 12px 12px 3px;box-shadow:0 1px 0 var(--paper-edge),3px 0 0 var(--paper-2),5px 1px 0 var(--paper-edge),10px 14px 30px rgba(0,0,0,.22);
  overflow:hidden;transform-origin:left center;backface-visibility:hidden;will-change:transform}
.page .scroll{position:absolute;inset:0;overflow:hidden;padding:22px 22px 26px 30px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.page .scroll > *{flex-shrink:0}
.page .scroll.tall{overflow-y:auto;overscroll-behavior:contain}
.probe{visibility:hidden;pointer-events:none;z-index:-1}
.page[data-under]{z-index:1} .page[data-top]{z-index:2}
.page .fold{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.28));opacity:0}
.pageno{font:12px var(--mono);color:var(--muted);text-align:center;margin-top:auto;padding-top:8px}
.kicker{font:700 22px/1 var(--hand);color:var(--muted)}
.chapter{font:400 clamp(34px,10vw,52px)/1 var(--serif);margin:0}
.chapter small{display:block;font:600 16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ornament{height:10px;background:radial-gradient(circle,var(--muted) 1.2px,transparent 1.6px) center/14px 10px repeat-x;opacity:.5}
.hotel{font-size:13px;color:var(--muted)}
.time{font-family:var(--mono);font-size:13px;color:var(--muted)}
.kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}

.thumbs{position:absolute;top:10px;bottom:10px;right:-36px;width:40px;display:flex;flex-direction:column;gap:3px;z-index:5}
.thumb{flex:1 1 0;max-height:62px;min-height:18px;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;border-radius:0 9px 9px 0;
  background:var(--c,var(--paper-2));color:#fff;font:700 12px/1 var(--sans);writing-mode:vertical-rl;letter-spacing:.04em;padding:2px 0;
  transform:translateX(-6px);transition:transform .2s;box-shadow:2px 1px 4px rgba(0,0,0,.2)}
.thumb.plain{color:var(--ink);--c:var(--paper-2)}
.thumb[aria-current="true"]{transform:translateX(-14px);box-shadow:none;filter:saturate(1.1) brightness(1.05)}
.thumb:hover{transform:translateX(-2px)}
.m0{--c:var(--m0)} .m1{--c:var(--m1)} .m2{--c:var(--m2)} .m3{--c:var(--m3)} .m4{--c:var(--m4)}

.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px}
@media (max-width:520px){.wide-only{display:none}}
.bar button,.bar a{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none;font-weight:600}
.bar .count{font:12px var(--mono);color:var(--muted);min-width:120px;text-align:center}
@media (max-width:520px){.bar{gap:6px;padding-left:8px;padding-right:8px}.bar button,.bar a{padding:6px 10px}.bar .count{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}}

/* wide screens: two-page spread (left = the day's map and timeline) */
@media (min-width:980px){
  .reader{padding:24px 64px 70px 24px}
  .left-leaf{display:block;position:relative;flex:1;height:100%;margin-right:0}
  .left-leaf .page{border-radius:12px 3px 3px 12px;background:
    radial-gradient(circle at 20% 10%,rgba(0,0,0,.018) 0 1px,transparent 1px) 0 0/7px 7px,
    linear-gradient(270deg,rgba(0,0,0,.12) 0,rgba(0,0,0,0) 26px),var(--paper);transform:none}
  .left-leaf .page .scroll{padding:22px 30px 26px 22px}
  .stack .page .scroll{padding-left:34px}
}

/* phone-first book (trip JSON book.phone): on phones a chapter strip on top and bigger taps; at any width one map page
   (whole map + stop list) and one timetable page per day */
@media (max-width:979px){
  body.phone .reader{padding:calc(54px + env(safe-area-inset-top)) 10px calc(64px + env(safe-area-inset-bottom)) 10px}
  body.phone .thumbs{top:-46px;bottom:auto;left:0;right:0;width:auto;height:40px;flex-direction:row;gap:5px;overflow-x:auto;scrollbar-width:none;padding:0 2px}
  body.phone .thumbs::-webkit-scrollbar{display:none}
  body.phone .thumb{writing-mode:horizontal-tb;flex:0 0 auto;max-height:none;min-height:0;height:36px;min-width:44px;padding:0 12px;border-radius:9px;transform:none;font-size:13px}
  body.phone .thumb[aria-current="true"]{transform:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);outline:2px solid var(--ink);outline-offset:-2px}
  body.phone .stack .page .scroll{padding:20px 18px 22px 24px}
  body.phone .bar button,body.phone .bar a{min-width:44px;min-height:44px;font-size:15px}
}
body.phone .phonemap .spreadmap{width:100%;justify-self:stretch}
body.phone .phonemap .hint2{font-size:16px}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.legend li{min-width:0}
body.phone .legend .tt-p .zh{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.phone .legend .tt-p .en{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.phone .phonemap .chapter{font-size:32px} body.phone .phonemap .chapter small{font-size:13px;margin-top:4px}
body.phone .phonemap{gap:10px}
/* ---------- the folded map (user, 2026-10-09: "a folded map that scrolls, folds down"): one long map, its panels unfolding as they scroll in ---------- */
body.foldmode .left-leaf,body.foldmode .stack{display:none}
.fold{flex:1;height:100%;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;padding:26px 6px 30px;position:relative}
.fold .panel{max-width:860px;margin:0 auto;position:relative;padding:24px 22px 26px;
  background:
    repeating-linear-gradient(180deg,transparent 0 540px,rgba(0,0,0,.1) 556px,rgba(255,255,255,.8) 560px,rgba(255,255,255,0) 576px),
    linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.04) 10px,transparent 28px),#F4EEDC;
  box-shadow:0 12px 24px rgba(0,0,0,.14);transform-origin:50% 0;transform:perspective(1100px) rotateX(-58deg);opacity:.35;
  transition:transform .75s cubic-bezier(.25,1.15,.4,1),opacity .5s}
.fold .panel.odd{background-color:#EFE8D4}
.fold .panel + .panel::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,.1),rgba(0,0,0,.18));pointer-events:none}
.fold .panel .mapbox.ov{margin-bottom:16px}
.fold .panel:first-of-type{border-radius:6px 6px 0 0}
.fold .panel:last-of-type{border-radius:0 0 6px 6px}
.fold .panel.open{transform:none;opacity:1}
.fold .panel .scroll{position:static;overflow:visible;padding:0;inset:auto}
.fold .daypanel > .scroll:first-child{position:relative}
.fold .panel .pageno{display:none}
.fold .daypanel{display:grid;gap:22px}
@media (min-width:980px){ .fold .daypanel{grid-template-columns:1fr 1fr;align-items:start} }
.fold .panel.wallet{background:
    linear-gradient(90deg,transparent calc(33.3% - 10px),rgba(0,0,0,.08) calc(33.3% - 1px),rgba(255,255,255,.35) 33.3%,rgba(255,255,255,0) calc(33.3% + 10px)),
    linear-gradient(90deg,transparent calc(66.6% - 10px),rgba(255,255,255,.3) calc(66.6% - 1px),rgba(0,0,0,.1) 66.6%,rgba(0,0,0,0) calc(66.6% + 10px)),
    repeating-linear-gradient(45deg,rgba(0,0,0,.025) 0 2px,transparent 2px 6px),linear-gradient(180deg,rgba(0,0,0,.16),transparent 28px),linear-gradient(180deg,#D8B88A,#CDA977)}
.fold .panel.wallet .chapter,.fold .panel.wallet .kicker{color:#4A3420}
.fold .pcard{position:absolute;top:14px;right:16px;width:min(38%,230px);margin:0;padding:8px 8px 34px;background:#FFFEFA;box-shadow:0 8px 16px rgba(0,0,0,.25);transform:rotate(4deg);z-index:3}
.fold .pcard img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.fold .pcard figcaption{position:absolute;left:10px;right:10px;bottom:8px;font:700 18px/1 var(--hand);color:#3A332B;text-align:center}
.tstack{position:relative;z-index:1;max-width:560px;margin:8px auto 26px;padding:0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* stacked: the tickets stand upright side by side, tucked into the top of the paper so only 2/3 of each sticks out (user, 2026-10-09) */
.tstack:not(.open){margin-bottom:-84px}
.tstack:not(.open) .wl{position:relative;height:250px}
.tstack:not(.open) .wl > *,.tstack:not(.open) .stk{position:absolute;top:100%;width:480px;box-sizing:border-box;z-index:calc(10 + var(--i,0));transform-origin:0 0;
  --x:calc(50% + (var(--i,0) - (var(--n,1) - 1) / 2) * min(46px, (100vw - 150px) / 8));left:calc(var(--x) - 48px);transform:rotate(calc(-90deg + var(--rot,0deg))) scale(.5)}
/* stamps peek out of the paper too, upright, a little bigger (user, 2026-10-09) */
.tstack:not(.open) .stamps{display:contents}
.tstack:not(.open) .stk{width:168px;left:calc(var(--x) - 63px);transform:scale(.75) translateY(calc(-100% - 40px)) rotate(var(--rot,0deg))}
.tstack:not(.open) .stk.round{width:170px}
.fold .panel{z-index:2}
.fold.drop{transform-origin:50% 0;animation:fdrop 1s cubic-bezier(.25,.9,.3,1) both}
.fold.lift{transform-origin:50% 0;animation:flift .45s cubic-bezier(.5,0,.8,.4) both}
@keyframes flift{0%{transform:none}55%{transform:scaleY(.08)}100%{transform:translateY(-70vh) scaleY(.06);opacity:0}}
.foldhome{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:30;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#FFFCF4,#F1EADB);box-shadow:inset 0 0 0 1px #D9CDB4,0 4px 10px rgba(0,0,0,.25);transition:transform .2s}
.foldhome svg{width:28px;height:28px} .foldhome:hover{transform:translateY(-2px) rotate(-6deg)}
body.foldmode #shelf{display:none!important}
@keyframes fdrop{0%{transform:translateY(-70vh) scaleY(.06);opacity:0}40%{transform:translateY(0) scaleY(.06);opacity:1}55%{transform:scaleY(.3)}75%{transform:scaleY(.62)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){ .fold.drop{animation:none} }
.tstack:not(.open) .deep{display:none}
.tstack .wl > .day,.tstack .tclose{display:none}
.tstack.open{cursor:auto}
.tstack.open .wl{display:flex;flex-direction:column;gap:20px}
.tstack.open .wl > *{transform:rotate(var(--rot,0deg));align-self:stretch}
.tstack.open .wl > .day{display:block;align-self:flex-start;font:700 20px var(--hand);color:#2A2521;background:#FFF6E0;padding:0 12px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.25);margin:4px 0 -8px 6px}
.tstack.open .tclose{display:block;position:absolute;top:-16px;right:4px;z-index:41;border:0;background:#FFFEFA;border-radius:999px;width:36px;height:36px;font:700 16px var(--sans);color:#2A2521;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.tstack .wl .bp,.tstack .wl .tk,.tstack .wl .bpass,.tstack .wl .cnt,.tstack .wl .jrt{box-shadow:0 8px 18px rgba(0,0,0,.3)}
.tstack .wl .cnt,.tstack .wl .jrt{width:100%;max-width:none;box-sizing:border-box}
.tstack .wl .bp::before,.tstack .wl .bp::after,.tstack .wl .tk::before,.tstack .wl .tk::after,.tstack .bpass::before,.tstack .bpass::after{background:rgba(0,0,0,.2)}
.tstack .scroll{position:static;overflow:visible;padding:0;inset:auto}
.tstack .chapter,.tstack .kicker{display:none}
@media (max-width:560px){ .stamp{font-size:12px;padding:2px 7px;right:98px;top:22%} .bp .route{font-size:24px} }
@media (max-width:979px){ .fold .pcard{width:30%;top:-4px;right:8px;padding:5px 5px 24px} .fold .pcard figcaption{font-size:14px;bottom:5px} }
@media (prefers-reduced-motion: reduce){ .fold .panel{transform:none;opacity:1;transition:none} .fold{scroll-behavior:auto} }

/* ---------- papers on the fridge (user, 2026-10-09): folded map, ticket wallet, notes for upcoming days, postcards for finished ones ---------- */
body.phone{background:linear-gradient(90deg,#DCDFDC,#EEF0EE 10%,#EEF0EE 90%,#DCDFDC)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body.phone{background:linear-gradient(90deg,#26292B,#34383A 10%,#34383A 90%,#26292B)} }
body.phone .page{background:var(--paper)}
body.phone .page.paper-map{background:
  linear-gradient(90deg,transparent calc(33.3% - 1px),rgba(0,0,0,.07) calc(33.3% - 1px),rgba(255,255,255,.5) 33.3%,transparent calc(33.3% + 2px)),
  linear-gradient(90deg,transparent calc(66.6% - 1px),rgba(0,0,0,.07) calc(66.6% - 1px),rgba(255,255,255,.5) 66.6%,transparent calc(66.6% + 2px)),
  linear-gradient(180deg,transparent calc(50% - 1px),rgba(0,0,0,.06) calc(50% - 1px),rgba(255,255,255,.45) 50%,transparent calc(50% + 2px)),#F4EEDC;
  border-radius:4px;animation:unfold .7s cubic-bezier(.3,1.2,.5,1) both;transform-origin:50% 0}
@keyframes unfold{from{transform:perspective(900px) rotateX(-75deg) scaleY(.35);opacity:.4}}
body.phone .page.wallet{background:repeating-linear-gradient(45deg,rgba(0,0,0,.025) 0 2px,transparent 2px 6px),linear-gradient(180deg,#D8B88A,#CDA977);border-radius:10px}

/* boarding pass */

.bpass .ap b{display:block;font:800 34px/1 var(--sans);letter-spacing:.02em} .bpass .ap small{font:600 13px var(--sans);color:#333}

.bpass::before{top:-9px} .bpass::after{bottom:-9px}
.bpass .stamp{right:calc(34% + 16px);top:auto;bottom:14px;transform:rotate(-12deg)}

/* JR ticket */

/* admission stub */
.stamps{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.stk{position:relative;width:168px;color:#2A2521;flex:none}
.stk .in{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:12px 10px}
.stk.square{background:#FFFEFA;padding:7px;filter:drop-shadow(0 3px 5px rgba(60,40,20,.3));
  -webkit-mask:radial-gradient(circle 4px,transparent 96%,#000) -5.5px -5.5px/11px 11px round,linear-gradient(#000 0 0) content-box;-webkit-mask-composite:source-over;
  mask:radial-gradient(circle 4px,transparent 96%,#000) -5.5px -5.5px/11px 11px round,linear-gradient(#000 0 0) content-box;mask-composite:add}
.stk.square .in{min-height:150px;border:2px solid var(--tc);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--tc) 7%,transparent) 0 6px,transparent 6px 12px)}

.stk .k{font:800 11px var(--sans);letter-spacing:.12em;color:color-mix(in srgb,var(--tc) 75%,#000)}
.stk .n{font:700 15px/1.2 var(--zh);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stk .e{font:600 12px/1.2 var(--sans);color:#3E362E;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.stk .w{font:700 12px var(--mono);color:#2A2521;white-space:nowrap}
.stk .p{font:800 14px var(--mono)}
.stk .s{font:700 11px var(--sans);letter-spacing:.08em;color:#3E362E;text-transform:uppercase}
.stk .stamp{right:-6px;top:-4px;transform:rotate(14deg);font-size:12px;padding:2px 7px;background:#FFFEFA;opacity:1;mix-blend-mode:normal}
.tstack.open .stk{transform:rotate(var(--rot,0deg))}
@media (max-width:420px){ .stk{width:calc(50% - 8px)} .stk.round{width:calc(50% - 8px);height:auto;aspect-ratio:1} }
@media (max-width:560px){ .bpass{grid-template-columns:1fr} .bpass .bps{display:none} .bpass::before,.bpass::after{display:none} .bpass .bpg{grid-template-columns:repeat(3,1fr)} .bpass .ap b{font-size:28px} }
.stamp{position:absolute;right:104px;top:50%;transform:translateY(-50%) rotate(-14deg);border:3px solid #C8372A;color:#C8372A;border-radius:6px;padding:3px 10px;
  font:900 17px/1 var(--sans);letter-spacing:.14em;opacity:.82;pointer-events:none;mix-blend-mode:multiply}
.stamp.used{border-color:#7A7064;color:#7A7064}
.punch{position:absolute;right:38px;top:12px;width:14px;height:14px;border-radius:50%;background:#CDA977;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
body.phone .mapbox.ov{width:100%}
.spoke{stroke-width:2;stroke-dasharray:4 4;stroke-linecap:round;opacity:.8;fill:none}
.opin circle{stroke:#fff;stroke-width:2} .opin text{fill:#fff;font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central}
.hico circle{fill:var(--ink);stroke:#fff;stroke-width:3} .hico path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pop.small{width:clamp(40px,8%,70px);padding:3px 3px 13px} .pop.small .cap{font-size:8px}
.hotelpop{position:absolute;z-index:5;transform:translate(var(--hx,-50%),calc(-100% - 22px));max-width:46%;background:#FFFDF7;color:#2A2521;border-radius:6px;padding:3px 7px 4px;
  font:600 10px/1.25 var(--sans);box-shadow:0 0 0 1.5px var(--ink),0 4px 10px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hotelpop a{display:block;color:inherit;text-decoration:underline;text-decoration-color:rgba(14,107,102,.45);text-underline-offset:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto}
.hotelpop b{display:block;font:700 9px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#0E6B66}
body.phone .phonemap .tt-title{margin:14px 0 0;font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px dotted var(--line);padding-top:14px}
body.phone .phonemap .chapter{font-size:38px}
.legend button,.legend .plain{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center;min-height:40px;padding:3px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.legend button:focus-visible{outline:2px solid var(--accent)}
.legend .n{width:22px;height:22px;font-size:11px !important;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 12px var(--mono)}
body.phone .tt-head{min-height:44px;display:block}
body.phone .tt-t{font-size:13px;white-space:nowrap;margin-right:8px} /* time inline, before the place name */
body.phone .tt-head .tt-p{display:inline} body.phone .tt-head .tt-p .zh{display:inline} body.phone .tt-head .tt-p .en{display:block}
body.phone .tt-th{display:none} /* the stop's photo is on the map and in its sheet */
body.phone .tt-stop .about{margin:0;font-size:14px}
body.phone .tt-p .zh{font-size:16px} body.phone .tt-p .en{font-size:13px}
/* phone: a stop's details fold open from a drawn chevron at the right of its row (no emoji, no text line) */
body.phone .tt-stop{position:relative}
body.phone .tt-head{padding-right:40px}
body.phone .tt-more{margin:0}
body.phone .tt-more > summary{position:absolute;top:0;right:0;width:40px;height:44px;padding:0;font-size:0;list-style:none;cursor:pointer}
body.phone .tt-more > summary::-webkit-details-marker{display:none}
body.phone .tt-more > summary::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translate(-70%,-50%) rotate(-45deg);transition:transform .2s}
body.phone .tt-more[open] > summary::after{transform:translate(-50%,-75%) rotate(45deg)}
/* phone: a move is a plain timetable row, time then transport on one line, no "Getting here" box */
body.phone .tt-mv .ticket{background:color-mix(in srgb,var(--accent) 13%,transparent);border:0;border-radius:8px;box-shadow:none}
body.phone .tt-mv .ticket summary{display:block;padding:8px 40px 8px 10px;min-height:36px}
body.phone .tt-mv .tk-k{display:inline;font:13px var(--mono);letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap;margin-right:8px}
body.phone .tt-mv .tk-s{display:inline;font-weight:500;color:var(--accent)}
body.phone .tt-mv .tk-body{padding:0 10px 12px}
body.phone .tt-mv .ticket summary::after{top:15px;right:17px}
body.phone .ticket summary::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);top:22px;right:16px;transform:rotate(-45deg);transition:transform .2s}
body.phone .ticket[open] summary::after{transform:rotate(45deg)}
/* timetable easy to follow: the time is the bold anchor of every row, places and transport regular, one readable font */
body.phone .tt-head .tt-t,body.phone .tt-mv .tk-k{font:700 14px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--ink)}
body.phone .tt-head .tt-p .zh{font:400 15px/1.4 var(--zh)}
body.phone .tt-head .tt-p .en{font-size:12px}
body.phone .tt-mv .tk-s{font-weight:400}
body.phone .tt-stop pre.details{font:14px/1.55 var(--sans);color:var(--muted)}
body.phone .tt-more > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:8px}
body.phone .tt-stop .about{font-size:14px}
body.phone .hotel{font-size:14px}

/* ---------- content pieces (shared with the cards page) ---------- */
.maps{display:flex;flex-direction:column;gap:10px}
.mapbox{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:3/2;max-width:100%}
.mapbox.ov{aspect-ratio:720/520;width:min(100%,380px);align-self:center}
.mapbox img{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.maplabel{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--ink);font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);max-width:calc(100% - 16px);overflow-wrap:anywhere}body.lang-en .maplabel.long{font-size:9.5px}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.route.walk{stroke-dasharray:1 6} .route.drive{stroke-dasharray:8 6}
.pin circle{fill:var(--pin);stroke:var(--surface);stroke-width:2}
.pin text{fill:var(--pin-ink);font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin{cursor:pointer} .foldmode .pin,.foldmode .pop,.foldmode .legend button,.foldmode .tt-head{cursor:default} .foldmode .tt-head:disabled{color:inherit;opacity:1}
.hand{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.9;vector-effect:non-scaling-stroke}
.hand.m0{stroke:var(--m0)} .hand.m1{stroke:var(--m1)} .hand.m2{stroke:var(--m2)} .hand.m3{stroke:var(--m3)} .hand.m4{stroke:var(--m4)}
.hlabel{paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
.hlabel .d{font-family:"Caveat",cursive;font-weight:700} .hlabel .a{font-family:"Ma Shan Zheng","Caveat",cursive}
.hlabel.m0{fill:var(--m0)} .hlabel.m1{fill:var(--m1)} .hlabel.m2{fill:var(--m2)} .hlabel.m3{fill:var(--m3)} .hlabel.m4{fill:var(--m4)}
.ocircle{cursor:pointer} .ocircle:hover .hand,.ocircle:focus-visible .hand{stroke-width:5}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.toc button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px dotted var(--line)}
.toc button:focus-visible{outline:2px solid var(--accent)}
.toc .dn{font:700 20px/1 var(--hand);color:var(--c)}
.toc .t{font-weight:600} .toc .s{display:block;font:14px var(--zh);color:var(--muted)}
.toc .pg{font:12px var(--mono);color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 2px;border-bottom:1px dotted var(--line);cursor:pointer;align-items:baseline}
.timeline .t{font-family:var(--mono);font-size:12px;color:var(--muted)} .timeline .p{font:14px var(--zh)}
.timeline li[aria-current="true"]{background:var(--accent-soft)}
.place{display:flex;flex-direction:column;gap:2px}
.place .zh{font-size:26px;font-weight:700;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.place .en{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lines{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.lines li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.lines .dir{font-family:var(--zh);font-weight:600} .lines .st{font-family:var(--zh);color:var(--muted);font-size:13px}
.linechip{display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:3px 8px;border-radius:6px;color:#fff;font:600 12px var(--zh);max-width:100%;text-align:center;overflow-wrap:anywhere;background:var(--muted)}body.lang-en .linechip.long{font-size:10px}
.exit{display:inline-block;background:var(--sign);color:var(--sign-ink);font:600 12px var(--zh);padding:1px 6px;border-radius:4px}
.opts{font-family:var(--mono);font-size:13px;white-space:pre-wrap;background:var(--surface-2);border-radius:9px;padding:10px 12px;margin:0;overflow-wrap:anywhere}
.details{white-space:pre-wrap;font-size:14px;margin:0;overflow-wrap:anywhere}
.bi-line{display:block;white-space:pre-wrap}.en-l{display:block;color:var(--muted);font-size:.9em}
body.phone .tt-stop pre.details .en-l{font-size:.9em}
.note{background:var(--warn-soft);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:13px} .note b{color:var(--warn)}
.movemap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:8/5;background:var(--surface-2);max-width:100%}
.movemap img,.movemap svg{position:absolute;inset:0;width:100%;height:100%}
.art{border-radius:10px;overflow:hidden;background:var(--art-sky);aspect-ratio:360/140;max-height:170px}

    const scene = $('#coverScene');
    $('#reader').hidden = false; layout();
    cur = landing(Math.min(cur, pages.length - 1));
    const reveal = () => { scene.hidden = true; $('#reader').hidden = false; $('#bar').hidden = false; show(cur); syncChrome(); store.set('opened', true); };
    if (instant || reduced) { reveal(); return; }
    $('#reader').hidden = false; $('#bar').hidden = false; show(cur); syncChrome();
    scene.classList.add('opening');
    setTimeout(reveal, 1150);
  }
  function closeBook() { $('#coverScene').classList.remove('opening'); $('#coverScene').hidden = false; $('#reader').hidden = true; $('#bar').hidden = true; store.set('opened', false); $('#coverScene').focus(); }
  // the cover itself opens the book, at the contents (no button)
  const fromCover = () => { cur = 0; openBook(); };
  $('#coverScene').setAttribute('role', 'button'); $('#coverScene').setAttribute('tabindex', '0'); $('#coverScene').setAttribute('aria-label', `Open ${TRIP.title} at the contents`);
  $('#coverScene').addEventListener('click', fromCover);
  // swipe left on the cover opens it too
  let cx0 = null;
  $('#coverScene').addEventListener('pointerdown', (e) => { cx0 = e.clientX; });
  $('#coverScene').addEventListener('pointerup', (e) => { if (cx0 !== null && cx0 - e.clientX > 60) fromCover(); cx0 = null; });
  // a new size re-fits every page (debounced); late-loading fonts change line heights too
  let rt; const refit = (force) => { clearTimeout(rt); rt = setTimeout(() => { if (!$('#reader').hidden && !busy && (force === true || sizeKey() !== laidOut)) relayout(); }, 200); };
  new ResizeObserver(refit).observe($('#stack')); window.addEventListener('resize', refit); document.addEventListener('visibilitychange', refit); document.fonts && document.fonts.ready.then(() => refit(true));
  // ---------- the folded map ----------
  // Sections in order: the overview maps, the ticket wallet, then each day (map + stops, timetable beside or under it).
  // A finished trip pins the day's own photo to its fold as a postcard.
  let secs = [], secAt = 0;
  function dayPanel(di) {
    const wrap = el('div', { class: 'daypanel' }), left = phoneMapPage(di), tt = timetablePage(di);
    wrap.append(left, tt);
    const src = tripOver && dayPhoto(di);
    if (src) { const city = (TRIP.days[di].title.split(' · ')[2] || '').split(' → ').pop(), name = city || TRIP.days[di].short; left.prepend(el('figure', { class: 'pcard' }, el('img', { src, alt: '' }), el('figcaption', {}, dual(`第${di + 1}天 · ${name}`, `Day ${di + 1} · ${enFixed(name)}`)))); }
    return wrap;
  }
  // The tickets sit in a stack at the top of the map; tapping the stack (or the magnet) spreads them out (user, 2026-10-09).
  let tstack = null;
  function ticketStack() {
    const wallet = walletPage(); let i = 0;
    wallet.querySelectorAll('.wl > :not(.day):not(.stamps), .stamps > .stk').forEach((n) => { n.style.setProperty('--i', Math.min(i, 8)); n.style.viewTransitionName = `tk${i}`; if (i > 7) n.classList.add('deep'); n.style.setProperty('--rot', `${[-2, 1.5, -1, 2.5, -1.5, 1][i % 6]}deg`); i++; });
    if (!i) return null;
    wallet.querySelector('.wl').style.setProperty('--n', Math.min(i, 8));
    const close = el('button', { type: 'button', class: 'tclose', 'aria-label': 'Stack the tickets again', text: '✕' });
    const box = el('div', { class: 'tstack', id: 'tickets', role: 'button', tabindex: '0', 'aria-expanded': 'false', 'aria-label': `${i} tickets, tap to spread them out` }, close, wallet);
    box.addEventListener('click', (e) => { if (!box.classList.contains('open')) openTickets(); });
    box.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !box.classList.contains('open')) { e.preventDefault(); openTickets(); } });
    close.addEventListener('click', (e) => { e.stopPropagation(); closeTickets(); });
    return box;
  }
  const flip = (fn) => (document.startViewTransition && !reduced ? document.startViewTransition(fn) : fn());
  function openTickets() {
    if (!tstack) return;
    flip(() => { tstack.classList.add('open'); tstack.setAttribute('aria-expanded', 'true'); tstack.removeAttribute('role'); document.body.classList.add('tix-open'); });
    tstack.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }
  function closeTickets() {
    if (!tstack) return;
    flip(() => { tstack.classList.remove('open'); tstack.setAttribute('aria-expanded', 'false'); tstack.setAttribute('role', 'button'); document.body.classList.remove('tix-open'); });
    tstack.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }
  function foldStep(dir) { const i = Math.max(0, Math.min(secs.length - 1, secAt + dir)); secs[i] && secs[i].el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); }
  function openFold() {
    document.body.classList.add('foldmode');
    $('#coverScene').hidden = true; $('#reader').hidden = false; $('#bar').hidden = false;
    const fold = $('#fold'); fold.hidden = false; fold.classList.add('drop'); fold.addEventListener('animationend', () => fold.classList.remove('drop'), { once: true });
    // back to the fridge: a folded-map button that stays on screen; the paper folds back up, then the fridge opens (user, 2026-10-10)
    const home = TRIP.links && TRIP.links.bookcase; // none on the public copy: no way back to the fridge there (user, 2026-10-10)
    if (home) {
    const fh = el('a', { class: 'foldhome', href: home, target: /^https?:/.test(home) ? '_top' : '_self', title: 'Fold the map, back to the fridge', 'aria-label': 'Fold the map and go back to the fridge',
      html: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.2 9 4l6 2.2L21 4v13.8L15 20l-6-2.2L3 20z" fill="#FBF7EE" stroke="#2A2521" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4v13.8M15 6.2V20" stroke="#2A2521" stroke-width="1.6"/></svg>' });
    fh.addEventListener('click', (e) => {
      if (reduced || e.metaKey || e.ctrlKey) return;
      e.preventDefault(); fold.classList.add('lift');
      setTimeout(() => { if (fh.target === '_top') window.top.location.href = fh.href; else location.href = fh.href; }, 450);
    });
    document.body.append(fh);
    }
    tstack = ticketStack();
    if (tstack) fold.append(tstack);
    secs = [{ id: 'contents', label: ['🗺️', 'Map'], node: contentsPage(), tab: tocTab },
      ...TRIP.days.map((d, di) => ({ id: `day-${di}`, label: [`D${di + 1}`, `Day ${di + 1} · ${d.short}`], node: dayPanel(di), tab: dayTabs[di] })),
      ...(TRIP.budget ? [{ id: 'budget', label: ['💰', 'Budget'], node: budgetPage(), tab: budgetTab }] : []),
      ...(bookTab ? [{ id: 'bookit', label: ['🎟️', 'Book it'], node: bookItContent(), tab: bookTab }] : [])];
    secs.forEach((x, i) => { x.el = el('section', { class: `panel ${x.cls || ''}${i % 2 ? ' odd' : ''}`, id: `sec-${x.id}`, 'aria-label': x.label[1] }, x.node); fold.append(x.el); });
    updatePops();
    // each fold opens as it scrolls into view; the tab strip and the counter follow the fold at the top
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) e.target.classList.add('open'); }), { root: fold, rootMargin: '0px 0px -12% 0px' });
    secs.forEach((x) => io.observe(x.el));
    const track = () => {
      const top = fold.getBoundingClientRect().top + 90;
      let i = 0; secs.forEach((x, k) => { if (x.el.getBoundingClientRect().top <= top) i = k; });
      if (i === secAt && fold.dataset.tracked) return; secAt = i; fold.dataset.tracked = '1';
      secs.forEach((x, k) => x.tab && x.tab.setAttribute('aria-current', String(k === i)));
      const narrow = matchMedia('(max-width:520px)').matches;
      $('#count').textContent = narrow ? `${secs[i].label[0]} · ${i + 1}/${secs.length}` : `${secs[i].label[1]} · ${i + 1} / ${secs.length}`;
      if (phone()) { const on = secs[i].tab; if (on) thumbs.scrollTo({ left: on.offsetLeft - (thumbs.clientWidth - on.offsetWidth) / 2, behavior: reduced ? 'auto' : 'smooth' }); }
    };
    fold.addEventListener('scroll', () => requestAnimationFrame(track), { passive: true });
    track();
    if (location.hash === '#tickets') openTickets(); // a link straight to the tickets, spread out
  }
  if (!foldMode) $('#coverScene').hidden = false;
  if (foldMode) openFold(); else if (location.hash !== '#cover' && store.get('opened')) openBook(true); // from the bookcase shelf (#cover): always the cover first
})();
</script>
