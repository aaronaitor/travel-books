<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Magnets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Noto+Serif+SC:wght@600;900&family=Caveat:wght@600;700&family=Ma+Shan+Zheng&display=swap">
<style>
/* The trips as souvenir fridge magnets (user, 2026-10-09): one die-cut landmark magnet per trip on a fridge door,
   a paper tag under each with its dates; a magnet opens its book's cover. */
:root{
  --wall:#E8E2D6; --wall-2:#DCD4C4; --door:#F4F5F2; --door-2:#E4E7E3; --edge:#C9CDC8; --handle:#B9BEC0; --handle-2:#8E9497;
  --ink:#2A2521; --muted:#6F665B; --paper:#FFFDF6; --paper-edge:#E3DCCB; --accent:#C8372A;
  --serif:"Noto Serif SC",Georgia,serif; --hand:"Caveat","Ma Shan Zheng",cursive; --sans:"Archivo","Noto Serif SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --wall:#1A1816; --wall-2:#131210; --door:#3A3D3F; --door-2:#2C2F31; --edge:#202325; --handle:#6C7275; --handle-2:#4A4F52;
  --ink:#EDE6D8; --muted:#A99F8F; --paper:#F4EEDF; --paper-edge:#CFC6B3; color-scheme:dark } }
:root[data-theme="dark"]{
  --wall:#1A1816; --wall-2:#131210; --door:#3A3D3F; --door-2:#2C2F31; --edge:#202325; --handle:#6C7275; --handle-2:#4A4F52;
  --ink:#EDE6D8; --muted:#A99F8F; --paper:#F4EEDF; --paper-edge:#CFC6B3; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(120% 80% at 50% 0%,var(--wall) 0%,var(--wall-2) 100%);color:var(--ink);font:15px/1.5 var(--sans);padding:20px 16px 40px}
.fridge{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:6px;filter:drop-shadow(0 22px 30px rgba(0,0,0,.22))}
.door{position:relative;background:linear-gradient(90deg,var(--door-2),var(--door) 12%,var(--door) 88%,var(--door-2));border:1px solid var(--edge);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.06)}
.door::after{content:"";position:absolute;right:14px;width:12px;border-radius:7px;background:linear-gradient(90deg,var(--handle-2),var(--handle) 45%,var(--handle-2));box-shadow:1px 2px 3px rgba(0,0,0,.25)}
.freezer{border-radius:26px 26px 8px 8px;padding:22px 52px 22px 26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.freezer::after{bottom:16px;height:46px}
.main{border-radius:8px 8px 26px 26px;padding:30px 48px 40px 22px;min-height:420px}
.main::after{top:22px;height:120px}
h1{margin:0;font:400 clamp(30px,8vw,44px)/1.05 var(--hand);color:var(--ink);transform:rotate(-1.5deg)}
h1 small{display:block;font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transform:none;margin-top:4px}
.next{position:relative;background:#FFF3A8;color:#3A3220;padding:12px 16px 10px;font:700 21px/1.1 var(--hand);transform:rotate(2.5deg);box-shadow:0 6px 10px rgba(0,0,0,.18)}
.next b{display:block;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#7A6A3A;margin-bottom:2px}
.next::before{content:"";position:absolute;top:-9px;left:calc(50% - 9px);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8A7A,#C8372A 60%,#8E1F15);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.magnets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:34px 22px;align-items:start}
.magnet{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;transform:rotate(var(--r));transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.magnet .art{width:100%;max-width:200px;filter:drop-shadow(0 7px 5px rgba(0,0,0,.28)) drop-shadow(0 1px 1px rgba(0,0,0,.25));position:relative;z-index:1}
.magnet .art svg{display:block;width:100%;height:auto}
.magnet:hover,.magnet:focus-visible{transform:rotate(var(--r)) translateY(-5px) scale(1.04)}
.magnet:focus-visible .art{outline:3px solid var(--accent);outline-offset:4px;border-radius:20px}
.magnet[aria-disabled="true"]{cursor:default;opacity:.8}
.tag{margin-top:-10px;background:var(--paper);border:1px solid var(--paper-edge);color:#3A332B;padding:10px 12px 5px;min-width:70%;text-align:center;transform:rotate(calc(var(--r) * -1.6));
  box-shadow:0 3px 6px rgba(0,0,0,.14);font:700 19px/1.05 var(--hand)}
.tag span{display:block;font:600 11px var(--sans);letter-spacing:.05em;color:#7A7064;margin-top:3px}
.tag.soon span{color:var(--accent)}
.hint{margin:28px 0 0;text-align:center;font:600 19px var(--hand);color:var(--muted)}
@media (max-width:560px){
  body{padding:12px 10px 28px}
  .freezer{padding:18px 44px 18px 18px}.main{padding:24px 38px 30px 14px}
  .door::after{right:10px;width:10px}
  .magnets{grid-template-columns:1fr 1fr;gap:26px 14px}
}
@media (prefers-reduced-motion: reduce){.magnet{transition:none}}
</style>

<div class="fridge">
  <section class="door freezer">
    <h1 id="title"></h1>
    <div class="next" id="next" hidden></div>
  </section>
  <section class="door main" aria-label="Trips">
    <div class="magnets" id="magnets" role="list"></div>
    <p class="hint">Tap a magnet to open its book</p>
  </section>
</div>

<script>
const DATA = {"title":"Travel Magnets · 旅行冰箱贴","books":[{"title":"重庆-成都 2026","from":"2026-03-23","to":"2026-03-31","days":9,"pax":2,"cities":["重庆 Chongqing","成都 Chengdu"],"book":"books/cq-cd-2026/book.html","cards":null,"status":"done","note":"我们去过的地方","magnet":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 240 260\">\n  <defs>\n    <clipPath id=\"cq-shape\"><path d=\"M20 250V110a100 100 0 0 1 200 0v140z\"/></clipPath>\n    <linearGradient id=\"cq-sky\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#16204A\"/><stop offset=\".65\" stop-color=\"#3A3B7E\"/><stop offset=\"1\" stop-color=\"#7A4A86\"/></linearGradient>\n    <linearGradient id=\"cq-river\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2C5C78\"/><stop offset=\"1\" stop-color=\"#17344A\"/></linearGradient>\n  </defs>\n  <g clip-path=\"url(#cq-shape)\">\n    <rect width=\"240\" height=\"260\" fill=\"url(#cq-sky)\"/>\n    <g fill=\"#FFF3C4\"><circle cx=\"58\" cy=\"52\" r=\"1.6\"/><circle cx=\"92\" cy=\"34\" r=\"1.2\"/><circle cx=\"170\" cy=\"40\" r=\"1.5\"/><circle cx=\"196\" cy=\"70\" r=\"1.1\"/><circle cx=\"130\" cy=\"24\" r=\"1\"/><circle cx=\"44\" cy=\"92\" r=\"1.1\"/></g>\n    <circle cx=\"176\" cy=\"66\" r=\"13\" fill=\"#FFE7A0\"/><circle cx=\"182\" cy=\"62\" r=\"12\" fill=\"#3A3B7E\"/>\n    <!-- city towers behind -->\n    <g fill=\"#24285A\"><rect x=\"18\" y=\"96\" width=\"22\" height=\"90\"/><rect x=\"44\" y=\"82\" width=\"16\" height=\"104\"/><rect x=\"186\" y=\"88\" width=\"20\" height=\"98\"/><rect x=\"208\" y=\"104\" width=\"18\" height=\"82\"/><path d=\"M164 186V100l8-12 8 12v86z\"/></g>\n    <g fill=\"#F7C873\" opacity=\".5\"><rect x=\"22\" y=\"104\" width=\"3\" height=\"3\"/><rect x=\"30\" y=\"118\" width=\"3\" height=\"3\"/><rect x=\"48\" y=\"96\" width=\"3\" height=\"3\"/><rect x=\"190\" y=\"98\" width=\"3\" height=\"3\"/><rect x=\"198\" y=\"120\" width=\"3\" height=\"3\"/><rect x=\"212\" y=\"114\" width=\"3\" height=\"3\"/></g>\n    <!-- cliff -->\n    <path d=\"M60 200c4-30 2-62 10-92h100c8 30 6 62 10 92z\" fill=\"#3B2A22\"/>\n    <!-- 洪崖洞: stacked stilt houses, lit -->\n    <g stroke=\"#2A1810\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n      <path d=\"M78 196h84v-22H78z\" fill=\"#B5462E\"/><path d=\"M72 176l48-12 48 12z\" fill=\"#2A1810\"/>\n      <path d=\"M82 164h76v-20H82z\" fill=\"#C24F30\"/><path d=\"M76 146l44-11 44 11z\" fill=\"#2A1810\"/>\n      <path d=\"M87 135h66v-19H87z\" fill=\"#CF5A33\"/><path d=\"M81 118l39-10 39 10z\" fill=\"#2A1810\"/>\n      <path d=\"M93 108h54v-18H93z\" fill=\"#DB6636\"/><path d=\"M88 92l32-9 32 9z\" fill=\"#2A1810\"/>\n      <path d=\"M102 83h36v-14h-36z\" fill=\"#E57A3C\"/><path d=\"M98 70l22-12 22 12z\" fill=\"#2A1810\"/>\n    </g>\n    <g fill=\"#FFD36B\">\n      <rect x=\"84\" y=\"180\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"98\" y=\"180\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"112\" y=\"180\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"126\" y=\"180\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"140\" y=\"180\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"152\" y=\"180\" width=\"6\" height=\"9\" rx=\"1\"/>\n      <rect x=\"88\" y=\"149\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"102\" y=\"149\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"116\" y=\"149\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"130\" y=\"149\" width=\"8\" height=\"9\" rx=\"1\"/><rect x=\"144\" y=\"149\" width=\"8\" height=\"9\" rx=\"1\"/>\n      <rect x=\"93\" y=\"120\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"106\" y=\"120\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"119\" y=\"120\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"132\" y=\"120\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"143\" y=\"120\" width=\"5\" height=\"9\" rx=\"1\"/>\n      <rect x=\"99\" y=\"94\" width=\"7\" height=\"8\" rx=\"1\"/><rect x=\"112\" y=\"94\" width=\"7\" height=\"8\" rx=\"1\"/><rect x=\"125\" y=\"94\" width=\"7\" height=\"8\" rx=\"1\"/><rect x=\"137\" y=\"94\" width=\"5\" height=\"8\" rx=\"1\"/>\n      <rect x=\"108\" y=\"73\" width=\"7\" height=\"6\" rx=\"1\"/><rect x=\"124\" y=\"73\" width=\"7\" height=\"6\" rx=\"1\"/>\n    </g>\n    <g fill=\"#E8442E\"><circle cx=\"84\" cy=\"170\" r=\"3\"/><circle cx=\"156\" cy=\"170\" r=\"3\"/><circle cx=\"90\" cy=\"140\" r=\"2.6\"/><circle cx=\"150\" cy=\"140\" r=\"2.6\"/></g>\n    <!-- river with reflections -->\n    <rect y=\"196\" width=\"240\" height=\"64\" fill=\"url(#cq-river)\"/>\n    <g stroke=\"#FFC861\" stroke-width=\"2.4\" stroke-linecap=\"round\" opacity=\".75\"><path d=\"M86 206h16M108 212h22M136 206h14M96 220h12M124 224h18\"/></g>\n    <!-- panda -->\n    <g transform=\"translate(186 214)\">\n      <circle cx=\"-15\" cy=\"-20\" r=\"8\" fill=\"#1E1E1E\"/><circle cx=\"15\" cy=\"-20\" r=\"8\" fill=\"#1E1E1E\"/>\n      <ellipse cx=\"0\" cy=\"0\" rx=\"24\" ry=\"22\" fill=\"#FFFFFF\"/>\n      <ellipse cx=\"-9\" cy=\"-2\" rx=\"6\" ry=\"8\" fill=\"#1E1E1E\" transform=\"rotate(-25 -9 -2)\"/><ellipse cx=\"9\" cy=\"-2\" rx=\"6\" ry=\"8\" fill=\"#1E1E1E\" transform=\"rotate(25 9 -2)\"/>\n      <circle cx=\"-8\" cy=\"-2\" r=\"2.2\" fill=\"#fff\"/><circle cx=\"8\" cy=\"-2\" r=\"2.2\" fill=\"#fff\"/>\n      <ellipse cx=\"0\" cy=\"8\" rx=\"4\" ry=\"3\" fill=\"#1E1E1E\"/><circle cx=\"-14\" cy=\"8\" r=\"3.5\" fill=\"#F7A9B4\" opacity=\".8\"/><circle cx=\"14\" cy=\"8\" r=\"3.5\" fill=\"#F7A9B4\" opacity=\".8\"/>\n    </g>\n  </g>\n  <!-- die-cut white edge + gloss -->\n  <path d=\"M20 250V110a100 100 0 0 1 200 0v140z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"8\" stroke-linejoin=\"round\"/>\n  <path d=\"M40 120a80 80 0 0 1 120-68c-46 4-82 30-104 74z\" fill=\"#fff\" opacity=\".16\"/>\n\n  <!-- banner -->\n  <path d=\"M8 222h224l-10 15 10 15H8l10-15z\" fill=\"#D7372A\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n  <text x=\"120\" y=\"244\" text-anchor=\"middle\" font-family=\"'Noto Serif SC','Songti SC',serif\" font-weight=\"900\" font-size=\"20\" fill=\"#FFF6E0\" letter-spacing=\"2\">重庆 · 成都</text>\n</svg>","sheet_pdf":"books/cq-cd-2026/sheet.pdf","sheet_name":"重庆-成都 2026.xlsx","cloth":"#1F4F4A"}],"built":"2026-10-09"};
(() => {
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k === 'html') n.innerHTML = v; else if (v != null && v !== false) n.setAttribute(k, v); } for (const k of kids) if (k != null) n.append(k); return n; };
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const d = (iso) => new Date(iso + 'T00:00');
  const when = (b) => {
    if (!b.from) return '';
    const a = d(b.from), z = d(b.to || b.from);
    return a.getMonth() === z.getMonth() ? `${a.getDate()}–${z.getDate()} ${MON[a.getMonth()]} ${a.getFullYear()}` : `${a.getDate()} ${MON[a.getMonth()]} – ${z.getDate()} ${MON[z.getMonth()]} ${z.getFullYear()}`;
  };
  const today = new Date(new Date().toDateString());
  const daysTo = (b) => Math.round((d(b.from) - today) / 864e5);

  const [en, zh] = (DATA.title || 'Travel Magnets · 旅行冰箱贴').split(' · ');
  $('#title').append(zh || en, el('small', { text: zh ? en : '' }));

  // the next trip, on a sticky note held by a magnet
  const next = DATA.books.filter((b) => b.from && d(b.to || b.from) >= today).sort((a, b) => a.from.localeCompare(b.from))[0];
  if (next) {
    const n = daysTo(next);
    $('#next').append(el('b', { text: 'Next trip' }), n > 0 ? `${next.title.replace(/\s*\d{4}$/, '')} in ${n} day${n === 1 ? '' : 's'}` : `${next.title.replace(/\s*\d{4}$/, '')}: now!`);
    $('#next').hidden = false;
  }

  // a trip without a drawn magnet yet gets a plain round one in its colour, lettered with its name
  const plain = (b) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260"><circle cx="120" cy="122" r="104" fill="${b.cloth}" stroke="#fff" stroke-width="8"/>`
    + `<circle cx="120" cy="122" r="86" fill="none" stroke="#F2D48B" stroke-width="2" stroke-dasharray="4 6"/>`
    + `<text x="120" y="118" text-anchor="middle" font-family="'Noto Serif SC',serif" font-weight="900" font-size="30" fill="#FFF6E0">${b.title.replace(/\s*\d{4}$/, '').replace(/[<&]/g, '')}</text>`
    + `<text x="120" y="152" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="700" font-size="18" fill="#F2D48B">${(b.from || '').slice(0, 4)}</text></svg>`;

  const box = $('#magnets');
  DATA.books.forEach((b, i) => {
    const r = [-4, 3, -2, 5, -5, 2][i % 6];
    const soon = b.from && daysTo(b) > 0, done = b.status === 'done';
    const status = done ? '去过 · been' : soon ? `in ${daysTo(b)} days` : b.status === 'planning' ? 'planning' : 'on the way';
    const m = el(b.book ? 'button' : 'div', { class: 'magnet', type: b.book ? 'button' : null, role: 'listitem', style: `--r:${r}deg`,
      'aria-label': `${b.title}, ${when(b)}${b.book ? ': open the book' : ''}`, 'aria-disabled': b.book ? null : 'true' },
      el('div', { class: 'art', html: b.magnet || plain(b) }),
      el('div', { class: `tag${soon ? ' soon' : ''}` }, when(b) || b.title, el('span', { text: b.book ? status : (b.note || 'no book yet') })));
    if (b.book) m.addEventListener('click', () => { location.href = `${b.book}#cover`; }); // the book's cover; the cover opens the contents
    box.append(m);
  });
})();
</script>
